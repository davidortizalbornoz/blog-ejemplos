version: '3.4'

# Configuración alternativa con modelo multiidioma
# Uso: docker-compose -f docker-compose-multilingual.yml up -d

services:
  weaviate:
    image: semitechnologies/weaviate:1.35.0-dev-4431468.arm64
    container_name: weaviate-multilingual
    restart: on-failure:0
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-transformers'
      ENABLE_MODULES: 'text2vec-transformers'
      TRANSFORMERS_INFERENCE_API: 'http://t2v-transformers:8080'
      CLUSTER_HOSTNAME: 'node1'
      AUTOSCHEMA_ENABLED: 'true'
      LOG_LEVEL: 'info'
    volumes:
      - weaviate_data_multilingual:/var/lib/weaviate
    depends_on:
      - t2v-transformers
    networks:
      - weaviate

  # Modelo multiidioma: Soporta 50+ idiomas incluyendo español
  t2v-transformers:
    container_name: weaviate-transformers-multilingual
    image: semitechnologies/transformers-inference:sentence-transformers-paraphrase-multilingual-MiniLM-L12-v2
    restart: on-failure:0
    environment:
      ENABLE_CUDA: '0'
    networks:
      - weaviate

volumes:
  weaviate_data_multilingual:
    driver: local

networks:
  weaviate:
    driver: bridge
