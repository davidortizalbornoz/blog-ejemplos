version: '3.4'

services:
  weaviate:
    image: semitechnologies/weaviate:1.35.0-dev-4431468.arm64
    container_name: weaviate
    restart: on-failure:0
    ports:
      - "8080:8080"
      - "50051:50051"  # gRPC
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-transformers'
      ENABLE_MODULES: 'text2vec-transformers'
      TRANSFORMERS_INFERENCE_API: 'http://t2v-transformers:8080'
      CLUSTER_HOSTNAME: 'node1'
      # Configuración adicional
      AUTOSCHEMA_ENABLED: 'true'
      LOG_LEVEL: 'info'
    volumes:
      - weaviate_data:/var/lib/weaviate
    depends_on:
      - t2v-transformers
    networks:
      - weaviate

  # Servicio de inferencia de transformers (modelo local)
  t2v-transformers:
    container_name: weaviate-transformers
    # Opciones de modelos disponibles:
    # - sentence-transformers-all-MiniLM-L6-v2 (384 dims, rápido)
    # - sentence-transformers-all-mpnet-base-v2 (768 dims, mejor calidad)
    # - sentence-transformers-paraphrase-multilingual-MiniLM-L12-v2 (384 dims, multiidioma)
    # - sentence-transformers-multi-qa-MiniLM-L6-cos-v1 (384 dims, Q&A)
    image: semitechnologies/transformers-inference:sentence-transformers-all-MiniLM-L6-v2
    restart: on-failure:0
    environment:
      ENABLE_CUDA: '0'  # Cambiar a '1' si tienes GPU NVIDIA disponible
    networks:
      - weaviate

volumes:
  weaviate_data:
    driver: local

networks:
  weaviate:
    driver: bridge
